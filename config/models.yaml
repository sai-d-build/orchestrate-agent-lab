# Model registry.
#
# API keys are NEVER stored here.
# api_key_env points to the environment variable containing the secret.

# models:

  # ============================================================
  # OPENROUTER — FREE MODEL BENCHMARK
  # Lesson 1.2
  # ============================================================
models:

  # ============================================================
  # NVIDIA NEMOTRON — DIRECT API
  # RagSet Report Inference Experiment
  # ============================================================

  nvidia-ragset-inference:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY
    purpose: ragset_report_inference
    capabilities:
      - text
      - reasoning
      - structured_output
    parameters:
      temperature: 0
      max_output_tokens: 32000
      reasoning: false
    provider_policy:
      data_collection: deny
      zdr: true
      allow_fallbacks: false

  # Gold analysis with NVIDIA direct API - lower max_tokens to avoid gateway timeout
  nvidia-ragset-gold-analysis:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY
    purpose: ragset_gold_analysis
    capabilities:
      - text
      - structured_output
    parameters:
      temperature: 0
      max_output_tokens: 8000
      reasoning: false
    provider_policy:
      data_collection: deny
      zdr: true
      allow_fallbacks: false

  nvidia-ragset-validator:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY
    purpose: ragset_report_validation
    capabilities:
      - text
      - reasoning
      - structured_output
    parameters:
      temperature: 0
      max_output_tokens: 20000
      reasoning: false
    provider_policy:
      data_collection: deny
      zdr: true
      allow_fallbacks: false

  # USF API key variants for parallel inference
  nvidia-ragset-inference-usf:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY_USF
    purpose: ragset_report_inference
    capabilities:
      - text
      - reasoning
      - structured_output
    parameters:
      temperature: 0
      max_output_tokens: 32000
      reasoning: false
    provider_policy:
      data_collection: deny
      zdr: true
      allow_fallbacks: false

  nvidia-ragset-validator-usf:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY_USF
    purpose: ragset_report_validation
    capabilities:
      - text
      - reasoning
      - structured_output
    parameters:
      temperature: 0
      max_output_tokens: 20000
      reasoning: false
    provider_policy:
      data_collection: deny
      zdr: true
      allow_fallbacks: false

  # USF API key variant for gold analysis
  nvidia-ragset-gold-analysis-usf:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY_USF
    purpose: ragset_gold_analysis
    capabilities:
      - text
      - structured_output
    parameters:
      temperature: 0
      max_output_tokens: 16000
      reasoning: false
    provider_policy:
      data_collection: deny
      zdr: true
      allow_fallbacks: false

  # ============================================================
  # OPENROUTER — FREE MODEL BENCHMARK (fallback)
  # Lesson 1.2
  # ============================================================

  ragset-inference:
    provider: openrouter
