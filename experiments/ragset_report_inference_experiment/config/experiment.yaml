source:
  path: train.csv
  id_column: StudyInstanceUID
  report_column: Report

gold:
  require_all_labels_populated: true

retrieval:
  enabled: true
  method: tfidf
  top_k: 8

models:
  inference_profiles:
    - nvidia-ragset-inference
    - nvidia-ragset-inference-usf
  validator_profiles:
    - nvidia-ragset-validator
    - nvidia-ragset-validator-usf
  gold_analysis_profile: nvidia-ragset-gold-analysis
  temperature: 0

loop:
  max_attempts: 3

validation:
  require_validator_pass: true

runtime:
  output_dir: experiments/ragset_report_inference_experiment
  save_model_trace: true